  <title id="title">Crown capture probability</title>
  <desc id="desc">The same genus of 10 species, with 3 species sampled in two different ways. (a) The sampled species include at least one on each side of the true crown, so the crown of the sampled tree is the true crown. (b) All the sampled species are on one side of the true crown, so the sampled crown is younger than the true crown, and the unsampled species on the other side join the tree on the stem of the sampled crown.</desc>
