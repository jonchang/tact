<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" role="img" aria-labelledby="title desc">
  <title id="title">An intruding taxon breaks up a family</title>
  <desc id="desc">Part of the Carangaria backbone from the tutorial. The smallest clade containing every sampled species of Soleidae also contains Cynoglossus, from the family Cynoglossidae, so Soleidae is not monophyletic. TACT therefore adds the unsampled Soleidae genus Brachirus anywhere in the enclosing suborder Pleuronectoidei, for example next to Samaridae, rather than within Soleidae.</desc>
