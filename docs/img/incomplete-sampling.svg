  <title id="title">Ways to handle an incompletely sampled phylogeny</title>
  <desc id="desc">Four versions of the same tree of 20 species in three clades of 10, 6 and 4 species. (a) The complete tree. (b) The sampled tree, with the unsampled lineages dashed and the fraction of each clade sampled. (c) The taxonomic method, with each clade collapsed to a single tip with its species richness. (d) One tree from TACT, with the unsampled species placed at random within their clades.</desc>
