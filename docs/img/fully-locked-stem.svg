<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 340" width="660" height="340" role="img" aria-labelledby="title desc">
  <title id="title">Grafting onto the stem of a fully locked clade</title>
  <desc id="desc">A subfamily Caninae in which only the genus Canis is sampled. Canis is complete and locked, so every edge below the sampled crown of Caninae is locked. TACT instead draws an attachment time on the stem of Canis, between its crown age and the age of its parent node, and grafts the unsampled genus Vulpes there. The graft point becomes the new crown of Caninae.</desc>
